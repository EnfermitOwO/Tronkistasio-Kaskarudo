<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicia Sesión</title>
    <link rel="stylesheet" href="lzstyle.css">
</head>
<body>

    <div class="main">
        <section class="login-section">
            <section class="login-box">
                <img src="https://i.pinimg.com/originals/68/76/7d/68767dbf99904789ea1a270e7c54045c.gif" alt="Avatar">
                <h1>Inicia Sesión</h1>
                
                <form class="login-form">
                    <input type="email" placeholder="Correo electrónico" class="login-input">
                    <input type="password" placeholder="Contraseña" class="login-input">
                    <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
                    <button type="button" class="login-button">Iniciar sesión</button>
                </form>
            </section>
        </section>
    </div>

</body>
</html>
