<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Sitio</title>
  <link rel="stylesheet" href="le design.css">
</head>
<body>
  <div class="card">
    <header>
      <h1>Bienvenidos a Mi Sitio</h1>
      <button id="cambiar-tema">Cambiar Tema</button>
    </header>

    <section class="about">
      <h2>Sobre mí</h2>
      <p>Me gusta Naoto Chibi :^ .</p>
    </section>

    <section class="services">
      <h2>Servicios</h2>
      <div class="cards">
        <div class="card-item" onclick="window.location.href='earth/loginlz.html'">
          Login 
        </div>

        <div class="card-item" onclick="window.location.href='Rubi/index.html'">
          Información
        </div>

        <div class="card-item" onclick="window.location.href='Calcu/index.html'">
          Calculadora
        </div>
        
        <!-- Botón agregado -->
        <div class="card-item" onclick="document.getElementById('seccion-formulario').scrollIntoView({ behavior: 'smooth' })">
          Formulario
        </div>
      </div>
    </section>

    <section id="contacto">
      <h2>Contacto</h2>
      <!-- Formulario original -->
      <form id="formulario">
        <input type="text" id="nombre" placeholder="Tu nombre" required>
        <input type="email" id="correo" placeholder="Tu correo" required>
        <button type="submit">Enviar</button>
      </form>

      <!-- ================= SECCIÓN DE FORMULARIO NUEVA ================= -->
      <section id="seccion-formulario" class="seccion-formulario">
        <br><hr><br>
        <h2>Ponte en contacto</h2>
        <p>Déjanos tus datos y nos comunicaremos contigo a la brevedad.</p>

        <form action="#" method="POST" class="formulario-detallado">
          <!-- Nombre -->
          <div class="campo">
            <label for="nombre_completo">Nombre completo:</label>
            <input 
              type="text" 
              id="nombre_completo" 
              name="nombre_completo" 
              placeholder="Ej. Juan Pérez" 
              required
            >
          </div>

          <!-- Correo electrónico -->
          <div class="campo">
            <label for="correo_completo">Correo electrónico:</label>
            <input 
              type="email" 
              id="correo_completo" 
              name="correo_completo" 
              placeholder="nombre@ejemplo.com" 
              required
            >
          </div>

          <!-- Tipo de consulta / Asunto -->
          <div class="campo">
            <label for="asunto">Motivo:</label>
            <select id="asunto" name="asunto">
              <option value="consulta">Consulta general</option>
              <option value="soporte">Soporte técnico</option>
              <option value="sugerencia">Sugerencia</option>
            </select>
          </div>

          <!-- Mensaje -->
          <div class="campo">
            <label for="mensaje_completo">Mensaje:</label>
            <textarea 
              id="mensaje_completo" 
              name="mensaje_completo" 
              rows="4" 
              placeholder="Escribe tu mensaje aquí..." 
              required
            ></textarea>
          </div>

          <!-- Botón de envío -->
          <button type="submit" class="btn-enviar">Enviar formulario</button>
        </form>
      </section>

      <!-- Aquí aparecerá el mensaje del formulario original -->
      <p id="mensaje" style="display: none; color: green; font-weight: bold;"></p>
    </section>

    <div class="gif-container">
      <img id="imagen-gif" src="https://media.tenor.com/k0n2NDOGJ-kAAAAM/nanako-dojima-persona-4.gif" alt="GIF decorativo">
    </div>
  </div>

  <script src="java.js"></script>

  <script>
    document.getElementById("formulario").addEventListener("submit", function(event) {
      event.preventDefault(); // Evita recargar la página

      // Obtiene los valores del formulario pequeño original
      const nombre = document.getElementById("nombre").value.trim();
      const correo = document.getElementById("correo").value.trim();
      const mensaje = document.getElementById("mensaje");

      if (nombre && correo) {
        mensaje.textContent = " ¡Tu mensaje se envió correctamente!";
        mensaje.style.color = "green";
        mensaje.style.display = "block";

        // Limpia los campos después de enviar
        document.getElementById("formulario").reset();

        // Oculta el mensaje después de 3 segundos
        setTimeout(() => {
          mensaje.style.display = "none";
        }, 3000);
      } else {
        mensaje.textContent = "Por favor, completa todos los campos.";
        mensaje.style.color = "red";
        mensaje.style.display = "block";
      }
    });
  </script>
</body>
</html>
